# Which environment: dev | prod (loads application-{profile}.properties on top of this file)
spring.profiles.active=dev

# Load local .env file when present (key=value format).
spring.config.import=optional:file:.env[.properties]

# Server Configuration
server.port=8083

# JDBC driver (shared by dev and prod)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration (schema from entities; drop/recreate DB manually if you need a clean slate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# AI Service Configuration
ai.service.url=http://localhost:8000/chat
ai.service.website-copy-url=http://localhost:8000/website-copy

# Public Next.js template base (no trailing slash)
app.public-site.base-url=http://localhost:3001

# JWT (dev default — override in production)
app.jwt.secret=BuildBusinessLK-Dev-Secret-At-Least-Thirty-Two-Bytes-Long-Key
app.jwt.expiration-ms=604800000
