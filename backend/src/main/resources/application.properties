# Which environment: dev | prod (loads application-{profile}.properties on top of this file)
spring.profiles.active=dev

# Load a local .env file (key=value format) regardless of whether the app is
# started from the module, its parent backend folder, or the repository root.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:backend/backend/.env[.properties]

# Server Configuration
server.port=8083

# JDBC driver (shared by dev and prod)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration (schema from entities; drop/recreate DB manually if you need a clean slate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# AI Service Configuration
ai.service.url=http://localhost:8000/chat
ai.service.website-copy-url=http://localhost:8000/website-copy

# Image and Text generation via AI Horde (supports anonymous usage with key 0000000000)
app.aihorde.api-key=${AI_HORDE_API_KEY:0000000000}
app.aihorde.base-url=${AI_HORDE_BASE_URL:https://aihorde.net/api}
app.aihorde.image-models=${AI_HORDE_IMAGE_MODELS:AlbedoBase XL (SDXL),Juggernaut XL,stable_diffusion}
app.aihorde.text-models=${AI_HORDE_TEXT_MODELS:aphrodite/TheDrummer/Cydonia-24B-v4.3,aphrodite/TheDrummer/Skyfall-31B-v4.2,koboldcpp/L3-8B-Stheno-v3.2-Q5_K_M}

# JWT authentication. Set JWT_SECRET in the ignored backend/backend/.env file or deployment secret store.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000
