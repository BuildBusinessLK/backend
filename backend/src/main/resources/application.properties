# Load local .env and .env.local files when present
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]

# Active Profile (defaults to prod if not overridden by env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Server Configuration
server.port=${PORT:8083}

# JDBC driver (shared by dev and prod)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration (schema from entities; drop/recreate DB manually if you need a clean slate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# AI Service Configuration
ai.service.url=${AI_SERVICE_URL:http://localhost:8000/chat}
ai.service.website-copy-url=${AI_SERVICE_WEBSITE_COPY_URL:http://localhost:8000/website-copy}
ai.service.ad-generation-url=${AI_SERVICE_AD_GENERATION_URL:http://localhost:8000/ad-generate}
ai.service.recommendation-url=${AI_SERVICE_RECOMMENDATION_URL:http://localhost:8000/business-advisor}
ai.service.health-url=${AI_SERVICE_HEALTH_URL:http://localhost:8000/health}

# Public Next.js template base (no trailing slash)
app.public-site.base-url=${APP_PUBLIC_SITE_BASE_URL:http://localhost:3001}

# Application & Client Web App Settings
app.name=BuildBusinessLK
app.client.url=${APP_CLIENT_URL:http://localhost:3000}

# JWT Security Configuration (override APP_JWT_SECRET in production via .env or cloud environment)
app.jwt.secret=${APP_JWT_SECRET:BuildBusinessLK-Dev-Secret-At-Least-Thirty-Two-Bytes-Long-Key}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:604800000}

